<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RUTTO — places worth getting lost in</title>

    <meta
        name="description"
        content="RUTTO is an archive of places worth getting lost in — unclassified places, roadside stops, cafés, bars, restaurants and other places around the world."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://rutterrimo.github.io/Rutto/"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body>

    <main
        class="intro"
        id="home"
    >

        <div class="intro-content">

            <h1>RUTTO</h1>

            <p>
                places worth getting lost in
            </p>

            <button
                id="enter-map"
                class="enter-button"
            >
                ENTER THE MAP
            </button>


            <!-- PIXEL CAT -->

            <button
                id="cat-button"
                class="cat-button"
                aria-label="Enter the map"
            >

                <svg
                    class="pixel-cat"
                    viewBox="0 0 48 48"
                    aria-hidden="true"
                >

                    <!-- ears -->

                    <rect x="8" y="10" width="6" height="6"/>
                    <rect x="10" y="8" width="4" height="4"/>

                    <rect x="34" y="10" width="6" height="6"/>
                    <rect x="34" y="8" width="4" height="4"/>


                    <!-- head -->

                    <rect x="12" y="14" width="24" height="4"/>
                    <rect x="10" y="18" width="28" height="16"/>
                    <rect x="12" y="34" width="24" height="4"/>


                    <!-- eyes -->

                    <rect x="16" y="21" width="4" height="4"/>
                    <rect x="28" y="21" width="4" height="4"/>


                    <!-- nose -->

                    <rect x="22" y="27" width="4" height="3"/>


                    <!-- mouth -->

                    <rect x="18" y="30" width="4" height="2"/>
                    <rect x="26" y="30" width="4" height="2"/>


                    <!-- little body -->

                    <rect x="14" y="38" width="20" height="4"/>

                    <rect x="10" y="40" width="6" height="4"/>
                    <rect x="32" y="40" width="6" height="4"/>


                    <!-- tail -->

                    <rect x="34" y="36" width="6" height="4"/>
                    <rect x="38" y="32" width="4" height="6"/>
                    <rect x="40" y="28" width="4" height="6"/>

                </svg>

            </button>

        </div>

    </main>


    <section id="map">

        <button id="home-button">
            HOME
        </button>

        <button id="index-button">
            INDEX
        </
