<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RUTTO — places worth getting lost in</title>

    <meta
        name="description"
        content="RUTTO is an archive of places worth getting lost in — unclassified places, roadside stops, cafés, bars, restaurants and other places around the world."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://rutterrimo.github.io/Rutto/"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body>

    <!-- =====================================================
         CUSTOM CIGARETTE CURSOR
         ===================================================== -->

    <div
        id="rutto-cigarette-cursor"
        aria-hidden="true"
    >

        <div class="cigarette-smoke smoke-one"></div>
        <div class="cigarette-smoke smoke-two"></div>

        <div class="cigarette">

            <div class="cigarette-filter"></div>

            <div class="cigarette-tobacco"></div>

            <div class="cigarette-ember"></div>

        </div>

    </div>


    <main
        class="intro"
        id="home"
    >

        <div class="intro-content">

            <h1>RUTTO</h1>

            <p>
                places worth getting lost in
            </p>

            <button
                id="enter-map"
                class="enter-button"
                type="button"
            >
                ENTER THE MAP
            </button>

        </div>


        <div class="no-ratings">
            FIELD NOTES. NO RATINGS.
        </div>

    </main>


    <section id="map">

        <button
            id="home-button"
            type="button"
        >
            HOME
        </button>

        <button
            id="index-button"
            type="button"
        >
            INDEX
        </button>


        <aside
            id="index-panel"
            aria-label="Place index"
        >

            <div class="index-header">

                <span>
                    INDEX
                </span>

                <button
                    id="close-index"
                    type="button"
                >
                    CLOSE
                </button>

            </div>


            <div id="index-list"></div>


            <div class="index-dedication">

                <span>
                    FOR
                </span>

                <strong>
                    ARCH. GEGIO TDM EBETE
                </strong>

                <em>
                    for all the places we haven't found yet
                </em>

            </div>

        </aside>


        <div id="map-container"></div>

    </section>


    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>

    <script src="script.js"></script>

</body>

</html>
