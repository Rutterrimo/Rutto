<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RUTTO — places worth getting lost in</title>

    <meta
        name="description"
        content="RUTTO is an archive of places worth getting lost in — unclassified places, roadside stops, cafés, bars, restaurants and other places around the world."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://rutterrimo.github.io/Rutto/"
    >

    <!-- =====================================================
         MAIN SITE CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- =====================================================
         CAT CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="cat/cat.css"
    >


    <!-- =====================================================
         LEAFLET
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body>

    <!-- =====================================================
         HOME / INTRO
         ===================================================== -->

    <main
        class="intro"
        id="home"
    >

        <div class="intro-content">

            <h1>RUTTO</h1>

            <p>
                places worth getting lost in
            </p>

            <button
                id="enter-map"
                class="enter-button"
            >
                ENTER THE MAP
            </button>

        </div>


        <div class="no-ratings">
            NO RATINGS. NO RECOMMENDATIONS.
        </div>


        <!-- =================================================
             INTERACTIVE CAT
             ================================================= -->

        <div id="rutto-cat">

            <canvas
                id="rutto-cat-canvas"
                width="32"
                height="32"
            ></canvas>

        </div>


        <!-- =================================================
             PIXEL CIGARETTE
             ================================================= -->

        <div id="rutto-cigarette">

            <div class="cig-paper"></div>

            <div class="cig-filter"></div>

            <div class="cig-ember"></div>

        </div>


        <!-- =================================================
             SMOKE
             ================================================= -->

        <div id="rutto-smoke">

            <span></span>

            <span></span>

            <span></span>

        </div>


        <!-- =================================================
             CAT MESSAGE
             ================================================= -->

        <div id="rutto-message"></div>

    </main>


    <!-- =====================================================
         MAP
         ===================================================== -->

    <section id="map">

        <button id="home-button">
            HOME
        </button>


        <button id="index-button">
            INDEX
        </button>


        <!-- =================================================
             INDEX PANEL
             ================================================= -->

        <aside id="index-panel">

            <div class="index-header">

                <span>
                    INDEX
                </span>

                <button id="close-index">
                    CLOSE
                </button>

            </div>


            <div id="index-list"></div>

        </aside>


        <!-- =================================================
             LEAFLET MAP
             ================================================= -->

        <div id="map-container"></div>

    </section>


    <!-- =====================================================
         LEAFLET JAVASCRIPT
         ===================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- =====================================================
         MAIN MAP SCRIPT
         ===================================================== -->

    <script src="script.js"></script>


    <!-- =====================================================
         CAT SCRIPT
         ===================================================== -->

    <script src="cat/cat.js"></script>

</body>

</html>
