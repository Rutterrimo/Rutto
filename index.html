<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RUTTO — places worth getting lost in</title>

    <meta
        name="description"
        content="RUTTO is an archive of places worth getting lost in — unclassified places, roadside stops, cafés, bars, restaurants and other places around the world."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://rutterrimo.github.io/Rutto/"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Leaflet CSS with SRI and crossorigin -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">

</head>


<body>

    <main
        class="intro"
        id="home"
    >

        <div class="intro-content">

            <h1>RUTTO</h1>

            <p>
                places worth getting lost in
            </p>

            <button
                id="enter-map"
                class="enter-button"
                type="button"
                aria-controls="map"
                aria-label="Enter the map"
            >
                ENTER THE MAP
            </button>

        </div>

        <!-- Footer text requested -->
        <div class="home-footer" aria-hidden="true">
            no ratings. no reccomendations
        </div>

    </main>


    <section id="map" aria-label="Map section">

        <button id="home-button" type="button" aria-label="Go to home">
            HOME
        </button>

        <button id="index-button" type="button" aria-expanded="false" aria-controls="index-panel" aria-label="Open index">
            INDEX
        </button>


        <aside id="index-panel" role="region" aria-labelledby="index-heading" aria-hidden="true">
            <div class="index-header">

                <span id="index-heading">
                    INDEX
                </span>

                <button id="close-index" type="button" aria-label="Close index">
                    CLOSE
                </button>

            </div>

            <div id="index-list" role="list"></div>

        </aside>


        <!-- Accessible map container -->
        <div id="map-container" role="application" aria-label="Interactive map" tabindex="0"></div>

        <noscript>
            <p>
                This site requires JavaScript to show the interactive map. Please enable JavaScript or view the static index.
            </p>
        </noscript>

    </section>


    <!-- Leaflet JS with SRI and crossorigin -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

    <script src="script.js"></script>

</body>

</html>
