<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>RUTTO — places worth getting lost in</title>

    <meta
        name="description"
        content="RUTTO is an archive of places worth getting lost in — unclassified places, roadside stops, cafés, bars, restaurants and other places around the world."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://rutterrimo.github.io/Rutto/"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body>

    <!-- =====================================================
         INTRO
         ===================================================== -->

    <main
        class="intro"
        id="home"
    >

        <div class="intro-content">

            <h1>RUTTO</h1>

            <p>
                places worth getting lost in
            </p>

            <button
                id="enter-map"
                class="enter-button"
                type="button"
            >
                ENTER THE MAP
            </button>

        </div>

    </main>


    <!-- =====================================================
         MAP
         ===================================================== -->

    <section id="map">

        <button
            id="home-button"
            type="button"
            aria-label="Return to home"
        >
            HOME
        </button>


        <button
            id="index-button"
            type="button"
            aria-label="Open index"
            aria-expanded="false"
        >
            INDEX
        </button>


        <!-- =================================================
             INDEX PANEL
             ================================================= -->

        <aside
            id="index-panel"
            aria-hidden="true"
        >

            <div class="index-header">

                <span>
                    INDEX
                </span>

                <button
                    id="close-index"
                    type="button"
                    aria-label="Close index"
                >
                    CLOSE
                </button>

            </div>

            <div id="index-list"></div>

        </aside>


        <!-- =================================================
             LEAFLET MAP
             ================================================= -->

        <div id="map-container"></div>

    </section>


    <!-- =====================================================
         LEAFLET
         ===================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>

    <script src="script.js"></script>

</body>

</html>
